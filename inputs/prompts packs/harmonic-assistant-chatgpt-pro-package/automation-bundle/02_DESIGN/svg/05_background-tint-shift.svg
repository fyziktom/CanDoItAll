<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a28"/>
      <stop offset="100%" stop-color="#0b1019"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="520" fill="url(#baseGrad)"/>

  <text x="40" y="44" fill="#cfe3ff" font-family="Segoe UI" font-size="18" font-weight="700">Color Band / Background Tint Shift Concept</text>

  <!-- Band area -->
  <rect x="60" y="80" width="1080" height="360" fill="none" stroke="#335" stroke-dasharray="6 6"/>

  <!-- Example bands (current chord dark) -->
  <rect x="60" y="80" width="1080" height="120" fill="#2b6cb0" opacity="0.10"/>
  <rect x="60" y="200" width="1080" height="120" fill="#1f3a5f" opacity="0.22"/>
  <rect x="60" y="320" width="1080" height="120" fill="#3a1f1f" opacity="0.18"/>

  <!-- Center band highlight -->
  <rect x="60" y="240" width="1080" height="40" fill="#0a0f17" opacity="0.35"/>
  <line x1="60" y1="260" x2="1140" y2="260" stroke="#f4b03f" stroke-width="2" opacity="0.55"/>
  <text x="70" y="254" fill="#cfe3ff" font-family="Segoe UI" font-size="12">Centerline + current mood band</text>

  <!-- Arrow showing shift -->
  <path d="M 1120 110 L 1120 210" stroke="#cfe3ff" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#cfe3ff"/>
    </marker>
  </defs>
  <path d="M 1120 110 L 1120 210" stroke="#cfe3ff" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="760" y="470" fill="#cfe3ff" font-family="Segoe UI" font-size="13">
    The background mood bands shift so the current chord's color family sits at the centerline.
  </text>
  <text x="40" y="470" fill="#cfe3ff" font-family="Segoe UI" font-size="13">
    Implementation idea: draw vertical gradient with multiple stops and translate it by currentWorldY.
  </text>
</svg>
