<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect x="0" y="0" width="1200" height="520" fill="#0f1622"/>
  <text x="40" y="44" fill="#cfe3ff" font-family="Segoe UI" font-size="18" font-weight="700">Node + Label Layout</text>

  <!-- Node anatomy -->
  <circle cx="260" cy="220" r="38" fill="#5ac8a8" opacity="0.95"/>
  <circle cx="260" cy="220" r="44" fill="none" stroke="#5ac8a8" stroke-width="4" opacity="0.55"/>
  <text x="260" y="220" fill="#0f1622" font-family="Segoe UI" font-size="18" font-weight="800" text-anchor="middle" dominant-baseline="middle">Dm7</text>

  <!-- Label guides -->
  <line x1="260" y1="220" x2="430" y2="220" stroke="#3a4e75" stroke-dasharray="6 6"/>
  <text x="440" y="226" fill="#cfe3ff" font-family="Segoe UI" font-size="14">Label centered in node</text>

  <!-- Probability badge -->
  <rect x="212" y="160" rx="10" ry="10" width="96" height="24" fill="#101b2b" stroke="#3a4e75" opacity="0.9"/>
  <text x="260" y="176" fill="#cfe3ff" font-family="Segoe UI" font-size="12" text-anchor="middle" dominant-baseline="middle">p=34%</text>
  <text x="340" y="176" fill="#cfe3ff" font-family="Segoe UI" font-size="13">Optional probability badge</text>

  <!-- Hit area -->
  <rect x="200" y="160" width="120" height="120" fill="none" stroke="#f4b03f" stroke-dasharray="8 6" opacity="0.9"/>
  <text x="260" y="310" fill="#cfe3ff" font-family="Segoe UI" font-size="13" text-anchor="middle">Hit area >= 44px</text>

  <!-- Text scaling control -->
  <text x="700" y="120" fill="#cfe3ff" font-family="Segoe UI" font-size="14">Canvas control (top-right recommended)</text>
  <rect x="860" y="72" width="260" height="70" rx="14" ry="14" fill="#101b2b" stroke="#3a4e75" opacity="0.95"/>
  <rect x="884" y="92" width="54" height="34" rx="10" ry="10" fill="#15243a" stroke="#5a7bb0"/>
  <rect x="952" y="92" width="54" height="34" rx="10" ry="10" fill="#15243a" stroke="#5a7bb0"/>
  <text x="911" y="109" fill="#cfe3ff" font-family="Segoe UI" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle">A−</text>
  <text x="979" y="109" fill="#cfe3ff" font-family="Segoe UI" font-size="16" font-weight="700" text-anchor="middle" dominant-baseline="middle">A+</text>
  <text x="1070" y="109" fill="#cfe3ff" font-family="Segoe UI" font-size="13" text-anchor="middle" dominant-baseline="middle">Text 100%</text>

  <!-- Notes -->
  <text x="40" y="420" fill="#cfe3ff" font-family="Segoe UI" font-size="13">
    Notes:
  </text>
  <text x="40" y="444" fill="#cfe3ff" font-family="Segoe UI" font-size="13">
    • Node radius scales with zoom and probability, but keep a minimum radius for readability.
  </text>
  <text x="40" y="468" fill="#cfe3ff" font-family="Segoe UI" font-size="13">
    • For long chord labels, apply ellipsis and show full text on hover tooltip.
  </text>
</svg>
