<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <rect x="0" y="0" width="1200" height="520" fill="#0f1622"/>
  <text x="40" y="44" fill="#cfe3ff" font-family="Segoe UI" font-size="18" font-weight="700">Zoom-out Behavior When Many Steps Exist</text>

  <!-- viewport -->
  <rect x="60" y="80" width="1080" height="360" fill="none" stroke="#335" stroke-dasharray="6 6"/>
  <text x="70" y="74" fill="#cfe3ff" font-family="Segoe UI" font-size="12">Canvas viewport (example)</text>

  <!-- Nodes as small dots representing many steps -->
  <line x1="120" y1="260" x2="1080" y2="260" stroke="#7aa0d6" stroke-width="2" opacity="0.35"/>
  <text x="120" y="250" fill="#cfe3ff" font-family="Segoe UI" font-size="12">Centerline</text>

  <!-- Dense sequence -->
  <!-- 28 steps -->
  <circle cx="140" cy="240" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="174" cy="250" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="208" cy="260" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="242" cy="270" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="276" cy="280" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="310" cy="240" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="344" cy="250" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="378" cy="260" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="412" cy="270" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="446" cy="280" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="480" cy="240" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="514" cy="250" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="548" cy="260" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="582" cy="270" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="616" cy="280" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="650" cy="240" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="684" cy="250" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="718" cy="260" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="752" cy="270" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="786" cy="280" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="820" cy="240" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="854" cy="250" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="888" cy="260" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="922" cy="270" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="956" cy="280" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="990" cy="240" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="1024" cy="250" r="10" fill="#5ac8a8" opacity="0.75"/>
<circle cx="1058" cy="260" r="10" fill="#5ac8a8" opacity="0.75"/>
  <text x="60" y="460" fill="#cfe3ff" font-family="Segoe UI" font-size="13">
    If required width exceeds canvas width: compute zoom = clamp(width / requiredWidth, minZoom, 1.0).
  </text>
  <text x="60" y="484" fill="#cfe3ff" font-family="Segoe UI" font-size="13">
    Keep minZoom ~0.35. If still too dense, reduce history window or apply LOD/collapse runs.
  </text>

  <!-- Zoom formula -->
  <rect x="760" y="120" width="360" height="110" rx="14" ry="14" fill="#101b2b" stroke="#3a4e75" opacity="0.95"/>
  <text x="780" y="150" fill="#cfe3ff" font-family="Consolas" font-size="13">required = left + spanSteps*stepPx + right</text>
  <text x="780" y="175" fill="#cfe3ff" font-family="Consolas" font-size="13">zoom = clamp(width/required, 0.35, 1.0)</text>
  <text x="780" y="200" fill="#cfe3ff" font-family="Consolas" font-size="13">stepPx' = stepPx * zoom</text>
  <text x="780" y="225" fill="#cfe3ff" font-family="Consolas" font-size="13">radius' = radius * zoom</text>
</svg>
