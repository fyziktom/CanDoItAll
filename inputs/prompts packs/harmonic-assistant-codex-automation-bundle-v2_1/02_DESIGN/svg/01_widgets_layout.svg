  <text x="12" y="22" fill="#cfe3ff" font-family="Segoe UI" font-size="14">Top UI reserved area (widgets)</text>

  <!-- Widgets -->
  <rect x="14" y="14" width="330" height="72" rx="12" fill="rgba(16,27,43,0.92)" stroke="rgba(122,160,214,0.55)"/>
  <text x="26" y="38" fill="#cfe3ff" font-family="Segoe UI" font-size="13">Mood + Modules (collapsible)</text>

  <rect x="690" y="14" width="256" height="72" rx="12" fill="rgba(16,27,43,0.92)" stroke="rgba(122,160,214,0.55)"/>
  <text x="702" y="38" fill="#cfe3ff" font-family="Segoe UI" font-size="13">Text + Zoom + History</text>

  <rect x="14" y="444" width="320" height="82" rx="12" fill="rgba(16,27,43,0.92)" stroke="rgba(122,160,214,0.55)"/>
