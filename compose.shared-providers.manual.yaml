services:
  client-a:
    volumes:
      - type: volume
        source: manual-client-a-data
        target: /data
        volume:
          nocopy: true

volumes:
  manual-client-a-data:
    external: true
    name: ${MANUAL_CLIENT_A_DATA_VOLUME:?MANUAL_CLIENT_A_DATA_VOLUME must name the migrated manual client data volume}
