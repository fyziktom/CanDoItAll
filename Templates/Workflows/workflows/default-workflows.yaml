  - key: invoice-workbook-risk-switch
    name: Invoice Workbook Risk Switch
    description: Reads invoice rows from XLSX, classifies risk, and writes a branch-specific decision back to an output workbook.
    routingInstructions: Classify risk as high, medium, low, or default from invoice amount, status, and due date. Return risk and summary.
    graph:
      startNodeId: start
      nodes:
        - { id: start, kind: Start, name: Start, x: 80, y: 220 }
        - id: read-invoices
          kind: Executor
          name: Read invoice rows
          x: 300
          y: 220
          executor:
            id: spreadsheet
            settings:
              operation: RangeToMarkdown
              workbookPath: samples/workflows/invoices.xlsx
              worksheetName: Invoices
              rangeAddress: A1:F6
              maxRows: 50
              maxColumns: 12
          instructions: Read a bounded XLSX range for downstream LLM classification.
        - { id: classify-invoices, kind: LlmCall, name: Classify invoice risk, x: 560, y: 220 }
        - { id: risk-switch, kind: Triage, name: SWITCH, x: 820, y: 220 }
        - id: write-high-risk
          kind: Executor
          name: Write high risk decision
          x: 1120
          y: 20
          executor:
            id: spreadsheet
            settings:
              operation: WriteCell
              workbookPath: samples/workflows/invoices.xlsx
              outputWorkbookPath: samples/workflows/invoices-reviewed.xlsx
              worksheetName: Invoices
              cellAddress: G2
              value: High risk - finance review
              createWorkbookIfMissing: false
              overwrite: true
          instructions: Write a branch decision to an output XLSX workbook.
        - id: write-medium-risk
          kind: Executor
          name: Write medium risk decision
          x: 1120
          y: 160
          executor:
            id: spreadsheet
            settings:
              operation: WriteCell
              workbookPath: samples/workflows/invoices.xlsx
              outputWorkbookPath: samples/workflows/invoices-reviewed.xlsx
              worksheetName: Invoices
              cellAddress: G2
              value: Medium risk - owner review
              createWorkbookIfMissing: false
              overwrite: true
          instructions: Write a branch decision to an output XLSX workbook.
        - id: write-low-risk
          kind: Executor
          name: Write low risk decision
          x: 1120
          y: 300
          executor:
            id: spreadsheet
            settings:
              operation: WriteCell
              workbookPath: samples/workflows/invoices.xlsx
              outputWorkbookPath: samples/workflows/invoices-reviewed.xlsx
              worksheetName: Invoices
              cellAddress: G2
              value: Low risk - auto approve
              createWorkbookIfMissing: false
              overwrite: true
          instructions: Write a branch decision to an output XLSX workbook.
        - id: write-default-risk
          kind: Executor
          name: Write default decision
          x: 1120
          y: 440
          executor:
            id: spreadsheet
            settings:
              operation: WriteCell
              workbookPath: samples/workflows/invoices.xlsx
              outputWorkbookPath: samples/workflows/invoices-reviewed.xlsx
              worksheetName: Invoices
              cellAddress: G2
              value: Unhandled - manual review
              createWorkbookIfMissing: false
              overwrite: true
          instructions: Write a branch decision to an output XLSX workbook.
        - { id: end, kind: End, name: End, x: 1440, y: 220 }
      edges:
        - { source: start, target: read-invoices }
        - { source: read-invoices, target: classify-invoices }
        - { source: classify-invoices, target: risk-switch }
        - source: risk-switch
          target: write-high-risk
          kind: Conditional
          routing: { kind: SwitchCase, jsonPath: "$.risk", expectedValue: high, expectedValueKind: String, label: High }
        - source: risk-switch
          target: write-medium-risk
          kind: Conditional
          routing: { kind: SwitchCase, jsonPath: "$.risk", expectedValue: medium, expectedValueKind: String, label: Medium }
        - source: risk-switch
          target: write-low-risk
          kind: Conditional
          routing: { kind: SwitchCase, jsonPath: "$.risk", expectedValue: low, expectedValueKind: String, label: Low }
        - source: risk-switch
          target: write-default-risk
          kind: Conditional
          routing: { kind: SwitchDefault, label: DEFAULT }
        - { source: write-high-risk, target: end }
        - { source: write-medium-risk, target: end }
        - { source: write-low-risk, target: end }
        - { source: write-default-risk, target: end }

