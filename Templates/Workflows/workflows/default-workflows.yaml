workflows:
  - key: document-summary-review-router
    name: Document Summary Review Router
    description: Summarizes an input document, gates finance/security review with IF/ELSE, and captures either an auto-summary or review request.
    routingInstructions: Return needsReview true when the document mentions missing approval, compliance risk, security risk, or legal risk. Preserve projectId when present.
    graph:
      startNodeId: start
      nodes:
        - { id: start, kind: Start, name: Start, x: 80, y: 220 }
        - { id: summarize, kind: LlmCall, name: Summarize document, x: 340, y: 220 }
        - { id: review-gate, kind: Triage, name: IF, x: 600, y: 220 }
        - { id: auto-summary, kind: StrictLogic, name: Store auto summary, x: 900, y: 120 }
        - { id: request-review, kind: HumanInput, name: Request finance/security review, externalRequestKind: Approval, x: 900, y: 330 }
        - { id: end, kind: End, name: End, x: 1180, y: 220 }
      edges:
        - { source: start, target: summarize }
        - { source: summarize, target: review-gate }
        - source: review-gate
          target: request-review
          kind: Conditional
          routing: { kind: Predicate, jsonPath: "$.needsReview", operator: Equals, expectedValue: "true", expectedValueKind: Boolean, label: IF }
        - source: review-gate
          target: auto-summary
          kind: Conditional
          routing: { kind: Predicate, jsonPath: "$.needsReview", operator: Equals, expectedValue: "false", expectedValueKind: Boolean, label: ELSE }
        - { source: auto-summary, target: end }
        - { source: request-review, target: end }

  - key: email-task-creation-router
    name: Email Task Creation Router
    description: Classifies email as tasks, ASAP response, informative, or default with SWITCH/default and creates WorkItem/task nodes for actionable email requests.
    routingInstructions: |-
      Classify route as `tasks`, `asap_response`, `informative`, or `no_action`.
      Use `tasks` when the sender asks me or my team to do concrete work.
      Use `asap_response` when a reply is explicitly urgent, same-day, blocked, escalated, or phrased as ASAP/immediate.
      Use `informative` when the email only gives FYI/context/status and no work is assigned to me.
      Use `no_action` when the message is delegated to someone else, spam-like, or not relevant; this goes through the SWITCH default branch.
      For `tasks` and `asap_response`, return a non-empty tasks array. Each task requires title, summary, owner, dueUtc when present, urgency, requiresResponse, asap, sourceEmailId, and evidence.
      Create tasks only for actions assigned to me or required from the current project team; do not create tasks for FYI text or work assigned solely to another person.
      Preserve projectId and nodeId so the project-structure executor creates WorkItem/task nodes under the workflow node.
    graph:
      startNodeId: start
      nodes:
        - { id: start, kind: Start, name: Start, x: 80, y: 220 }
        - id: ingest-email-sources
          kind: Executor
          name: Load email sources
          x: 320
          y: 220
          executor:
            id: source.ingest
            settings:
              includeAdditionalSources: true
              includeParentNodePath: true
              includeSelectedNodePaths: true
              includeParentSubtreePaths: true
              recursiveFolders: true
              allowAbsoluteInputPaths: true
              maxFiles: 16
              maxCharactersPerFile: 14000
              maxTotalCharacters: 90000
          instructions: Load explicit project-structure file and folder sources into bounded text before the LLM summarizes them.
        - { id: classify-email, kind: LlmCall, name: Classify email, x: 620, y: 220 }
        - { id: email-switch, kind: Triage, name: SWITCH, x: 900, y: 220 }
        - id: create-email-task-nodes
          kind: Executor
          name: Create task nodes
          x: 1210
          y: 20
          executor:
            id: project-structure
            settings:
              operation: CreateTaskNodes
              projectIdJsonPath: "$.projectId"
              nodeIdJsonPath: "$.nodeId"
              taskItemsJsonPath: "$.tasks"
              taskObjectSubtype: task
              maxTaskNodes: 12
          instructions: Create WorkItem/task nodes under the workflow node from the LLM tasks array.
        - id: create-asap-response-task
          kind: Executor
          name: Create ASAP response task
          x: 1210
          y: 170
          executor:
            id: project-structure
            settings:
              operation: CreateTaskNodes
              projectIdJsonPath: "$.projectId"
              nodeIdJsonPath: "$.nodeId"
              taskItemsJsonPath: "$.tasks"
              taskObjectSubtype: task
              maxTaskNodes: 12
          instructions: Create WorkItem/task nodes under the workflow node from the LLM tasks array.
        - id: store-informative-summary
          kind: Executor
          name: Store informative summary
          x: 1210
          y: 320
          executor:
            id: project-structure
            settings:
              operation: CreateAsset
              projectIdJsonPath: "$.projectId"
              nodeIdJsonPath: "$.nodeId"
              title: Informative email summary
              assetKind: md
              contentFromInput: true
              contentType: text/markdown
          instructions: Create a markdown asset in the selected project structure.
        - id: store-default-summary
          kind: Executor
          name: Store no-action summary
          x: 1210
          y: 470
          executor:
            id: project-structure
            settings:
              operation: CreateAsset
              projectIdJsonPath: "$.projectId"
              nodeIdJsonPath: "$.nodeId"
              title: No-action email summary
              assetKind: md
              contentFromInput: true
              contentType: text/markdown
          instructions: Create a markdown asset in the selected project structure.
        - { id: end, kind: End, name: End, x: 1530, y: 245 }
      edges:
        - { source: start, target: ingest-email-sources }
        - { source: ingest-email-sources, target: classify-email }
        - { source: classify-email, target: email-switch }
        - source: email-switch
          target: create-email-task-nodes
          kind: Conditional
          routing: { kind: SwitchCase, jsonPath: "$.route", expectedValue: tasks, expectedValueKind: String, label: Tasks }
        - source: email-switch
          target: create-asap-response-task
          kind: Conditional
          routing: { kind: SwitchCase, jsonPath: "$.route", expectedValue: asap_response, expectedValueKind: String, label: ASAP response }
        - source: email-switch
          target: store-informative-summary
          kind: Conditional
          routing: { kind: SwitchCase, jsonPath: "$.route", expectedValue: informative, expectedValueKind: String, label: Informative }
        - source: email-switch
          target: store-default-summary
          kind: Conditional
          routing: { kind: SwitchDefault, label: DEFAULT }
        - { source: create-email-task-nodes, target: end }
        - { source: create-asap-response-task, target: end }
        - { source: store-informative-summary, target: end }
        - { source: store-default-summary, target: end }

  - key: email-reply-draft-gate
    name: Email Reply Draft Gate
    description: Drafts a customer response only when the email requires a response; otherwise archives a compact summary.
    routingInstructions: Set requiresResponse true when sender expects an answer or asks a question. Include responseDraft only when true.
    graph:
      startNodeId: start
      nodes:
        - { id: start, kind: Start, name: Start, x: 80, y: 220 }
        - { id: analyze-email, kind: LlmCall, name: Analyze email response need, x: 340, y: 220 }
        - { id: response-gate, kind: Triage, name: IF, x: 620, y: 220 }
        - id: store-reply
          kind: Executor
          name: Store reply draft
          x: 900
          y: 120
          executor:
            id: storage.file
            settings:
              operation: WriteText
              path: samples/workflows/reply-draft.md
              contentFromInput: true
              overwrite: true
          instructions: Write the workflow JSON payload to a workspace file.
        - id: archive-summary
          kind: Executor
          name: Archive email summary
          x: 900
          y: 330
          executor:
            id: storage.file
            settings:
              operation: WriteText
              path: samples/workflows/email-archive.md
              contentFromInput: true
              overwrite: true
          instructions: Write the workflow JSON payload to a workspace file.
        - { id: end, kind: End, name: End, x: 1180, y: 220 }
      edges:
        - { source: start, target: analyze-email }
        - { source: analyze-email, target: response-gate }
        - source: response-gate
          target: store-reply
          kind: Conditional
          routing: { kind: Predicate, jsonPath: "$.requiresResponse", operator: Equals, expectedValue: "true", expectedValueKind: Boolean, label: IF }
        - source: response-gate
          target: archive-summary
          kind: Conditional
          routing: { kind: Predicate, jsonPath: "$.requiresResponse", operator: Equals, expectedValue: "false", expectedValueKind: Boolean, label: ELSE }
        - { source: store-reply, target: end }
        - { source: archive-summary, target: end }

  - key: gmail-label-email-summary-to-project
    name: Gmail Label Email Summary To Project
    description: Downloads Gmail messages with a configured label, summarizes the batch, and stores the markdown result under the selected project-structure node.
    routingInstructions: |-
      Summarize the downloaded Gmail message batch.
      Return route as `summarized`.
      Preserve projectId and nodeId from the input payload.
      Preserve runContext, including runContext.gmailProcessing, unchanged so the final Gmail step can move the processed label.
      The markdown field must include the Gmail label, message count, sender/subject evidence, key decisions or requests, open gaps, and recommended next actions.
      Do not include full message bodies unless a short excerpt is needed as evidence.
    graph:
      startNodeId: start
      nodes:
        - { id: start, kind: Start, name: Start, x: 80, y: 220 }
        - id: download-gmail
          kind: Executor
          name: Download Gmail label
          x: 340
          y: 220
          executor:
            id: gmail.messages-by-label
            settings:
              connectionId: ""
              label: CanDoItAllSummaryTest
              processedLabel: CanDoItAllSummaryTestProcessed
              maxMessages: 1
          instructions: Download a bounded Gmail message batch from the configured OAuth connection and label.
        - { id: summarize-gmail, kind: LlmCall, name: Summarize Gmail batch, x: 620, y: 220 }
        - id: store-gmail-summary
          kind: Executor
          name: Store Gmail summary
          x: 920
          y: 220
          executor:
            id: project-structure
            settings:
              operation: CreateAsset
              projectIdJsonPath: "$.projectId"
              nodeIdJsonPath: "$.nodeId"
              title: Gmail label email summary
              assetKind: md
              contentFromInput: true
              includeInputPayload: true
              contentType: text/markdown
          instructions: Create a markdown asset in the selected project structure from the LLM summary payload.
        - id: mark-gmail-processed
          kind: Executor
          name: Mark Gmail processed
          x: 1210
          y: 220
          executor:
            id: gmail.mark-message-processed
            settings:
              connectionId: ""
              sourceLabel: CanDoItAllSummaryTest
              processedLabel: CanDoItAllSummaryTestProcessed
              messageIdJsonPath: "$.inputPayload.runContext.gmailProcessing.messageIds[0]"
          instructions: Add the processed Gmail label and remove the source label after the summary asset is stored.
        - { id: end, kind: End, name: End, x: 1500, y: 220 }
      edges:
        - { source: start, target: download-gmail }
        - { source: download-gmail, target: summarize-gmail }
        - { source: summarize-gmail, target: store-gmail-summary }
        - { source: store-gmail-summary, target: mark-gmail-processed }
        - { source: mark-gmail-processed, target: end }

