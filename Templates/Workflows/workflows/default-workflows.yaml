          kind: Executor
          name: Load project-structure sources
          x: 330
          y: 220
          executor:
            id: source.ingest
            settings:
              includeAdditionalSources: true
              includeParentNodePath: true
              includeSelectedNodePaths: true
              includeParentSubtreePaths: true
              recursiveFolders: true
              allowAbsoluteInputPaths: true
              maxFiles: 16
              maxCharactersPerFile: 14000
              maxTotalCharacters: 90000
          instructions: Load explicit project-structure file and folder sources into bounded text before the LLM summarizes them.
        - { id: summarize-offer-folder, kind: LlmCall, name: Summarize offer folder, x: 640, y: 220 }
        - id: store-project-structure-summary
          kind: Executor
          name: Store workflow summary
          x: 950
          y: 220
          executor:
            id: project-structure
            settings:
              operation: CreateAsset
              projectIdJsonPath: "$.projectId"
              nodeIdJsonPath: "$.nodeId"
              title: Offer document summary
              assetKind: md
              contentFromInput: true
              contentType: text/markdown
          instructions: Create a markdown asset in the selected project structure.
        - { id: end, kind: End, name: End, x: 1260, y: 220 }
      edges:
        - { source: start, target: ingest-sources }
        - { source: ingest-sources, target: summarize-offer-folder }
        - { source: summarize-offer-folder, target: store-project-structure-summary }
        - { source: store-project-structure-summary, target: end }

