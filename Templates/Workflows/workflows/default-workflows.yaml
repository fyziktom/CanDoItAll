        - { source: marketing-update, target: end }
        - { source: executive-update, target: end }

  - key: mouser-order-reconciliation
    name: Mouser Order Reconciliation
    description: Compares the supplied Mouser order workbook and receipt PDF from a project-structure workflow node and stores the reconciliation summary under that workflow node.
    routingInstructions: |-
      Compare the loaded `Cart_Mar30_1059AM.xls` workbook rows with `MOUSER_Receipt_89566550.pdf`.
      Extract ordered quantity, shipped quantity, pending quantity, unit price, extended price, invoice number, order date, tracking numbers, and merchandise/freight/tax totals when present.
      Set route to `matched` only when the workbook and receipt agree on line items and totals; otherwise set `mismatch`.
      The markdown must contain a reconciliation table with Mouser part number, customer/manufacturer part number when visible, quantity, unit price, extended price, and source file evidence.
      Include any unreadable or missing source as a gap; do not mark matched if a required file was not loaded.
    graph:
      startNodeId: start
      nodes:
        - { id: start, kind: Start, name: Start, x: 80, y: 220 }
        - id: ingest-sources
          kind: Executor
          name: Load project-structure sources
          x: 330
          y: 220
          executor:
            id: source.ingest
            settings:
              includeAdditionalSources: true
              includeParentNodePath: true
              includeSelectedNodePaths: true
              includeParentSubtreePaths: true
              recursiveFolders: true
              allowAbsoluteInputPaths: true
              maxFiles: 16
              maxCharactersPerFile: 14000
              maxTotalCharacters: 90000
          instructions: Load explicit project-structure file and folder sources into bounded text before the LLM summarizes them.
        - { id: reconcile-mouser-order, kind: LlmCall, name: Reconcile Mouser order, x: 640, y: 220 }
        - id: store-project-structure-summary
          kind: Executor
          name: Store workflow summary
          x: 950
          y: 220
          executor:
            id: project-structure
            settings:
              operation: CreateAsset
              projectIdJsonPath: "$.projectId"
              nodeIdJsonPath: "$.nodeId"
              title: Mouser order reconciliation summary
              assetKind: md
              contentFromInput: true
              contentType: text/markdown
          instructions: Create a markdown asset in the selected project structure.
        - { id: end, kind: End, name: End, x: 1260, y: 220 }
      edges:
        - { source: start, target: ingest-sources }
        - { source: ingest-sources, target: reconcile-mouser-order }
        - { source: reconcile-mouser-order, target: store-project-structure-summary }
        - { source: store-project-structure-summary, target: end }

  - key: mouser-purchasing-summary
    name: Mouser Purchasing Summary
    description: Turns a Mouser order folder into a purchasing brief with line-item highlights, open questions, and a result asset under the workflow node.
    routingInstructions: |-
      Build a purchasing brief from all loaded Mouser order sources.
      Identify invoice/order number, order date, ship date, tracking numbers, destination, line-item highlights, large-cost items, total spend signals, and follow-up questions.
      Mention both the workbook and receipt source paths when loaded.
      Set risk to `low` when evidence is complete and internally consistent, `medium` when some values are missing, and `high` when documents conflict or no order document was readable.
    graph:
      startNodeId: start
      nodes:
        - { id: start, kind: Start, name: Start, x: 80, y: 220 }
        - id: ingest-sources
          kind: Executor
          name: Load project-structure sources
          x: 330
          y: 220
          executor:
            id: source.ingest
            settings:
              includeAdditionalSources: true
              includeParentNodePath: true
              includeSelectedNodePaths: true
              includeParentSubtreePaths: true
              recursiveFolders: true
              allowAbsoluteInputPaths: true
              maxFiles: 16
              maxCharactersPerFile: 14000
              maxTotalCharacters: 90000
          instructions: Load explicit project-structure file and folder sources into bounded text before the LLM summarizes them.
        - { id: summarize-mouser-purchase, kind: LlmCall, name: Summarize Mouser purchase, x: 640, y: 220 }
        - id: store-project-structure-summary
          kind: Executor
          name: Store workflow summary
          x: 950
          y: 220
          executor:
            id: project-structure
            settings:
              operation: CreateAsset
