  - key: offer-document-folder-summary
    name: Offer Document Folder Summary
    description: Summarizes a folder of product or offer PDFs and stores product, use-case, commercial, and evidence findings under the workflow node.
    routingInstructions: |-
      Treat the loaded offer folder as the primary source. Read every loaded document text and produce a real product and offer summary, not a placeholder.
      Identify product families, variants, use cases, technical requirements, capacity or performance limits, operating constraints, commercial terms, pricing evidence, and source file names.
      Include quotation evidence when loaded: quoted item names, aliases, currencies, quantities, discounts, price ranges, delivery terms, payment terms, warranty/service caveats, and validity dates.
      Map product aliases only when the source text explicitly supports the mapping; flag ambiguous aliases, missing prices, stale dates, and scanned or unreadable files as review gaps.
      If a catalogue has no extractable text, record it as a scanned/unreadable gap while still using the extractable specification, datasheet, and quotation documents.
      Set risk to `medium` when some sources are scanned, price evidence is stale, or commercial terms need current validation; set route to `summary`.
    graph:
      startNodeId: start
      nodes:
        - { id: start, kind: Start, name: Start, x: 80, y: 220 }
