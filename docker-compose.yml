services:
  postgres:
    image: postgres:16-alpine
    container_name: candoitall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: candoitall
      POSTGRES_USER: candoitall
      POSTGRES_PASSWORD: candoitall
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candoitall -d candoitall"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
