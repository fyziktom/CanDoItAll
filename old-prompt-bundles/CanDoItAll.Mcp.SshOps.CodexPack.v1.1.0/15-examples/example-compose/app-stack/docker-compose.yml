services:
  api:
    image: ghcr.io/example/candoitall-api:2026.03.20
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      ipfs:
        condition: service_started
    expose:
      - "8080"
    networks:
      - proxy
      - backend
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.api.rule: Host(`${APP_HOST}`)
      traefik.http.routers.api.entrypoints: websecure
      traefik.http.routers.api.tls: "true"
      traefik.http.routers.api.tls.certresolver: ${TRAEFIK_CERT_RESOLVER}
      traefik.http.services.api.loadbalancer.server.port: "8080"

  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  ipfs:
    image: ipfs/kubo:v0.38.2
    restart: unless-stopped
    environment:
      IPFS_PROFILE: server
      IPFS_PATH: /data/ipfs
      IPFS_SWARM_KEY_FILE: /run/secrets/swarm.key
    entrypoint: ["/bin/sh", "/init-private-swarm.sh"]
    expose:
      - "5001"
      - "8080"
      - "4001"
    volumes:
      - ipfs-data:/data/ipfs
      - ./ipfs/bootstrap-peers.txt:/bootstrap-peers.txt:ro
      - ./ipfs/init-private-swarm.sh:/init-private-swarm.sh:ro
    secrets:
      - swarm.key
    networks:
      - backend

volumes:
  postgres-data:
  ipfs-data:

secrets:
  swarm.key:
    file: ./ipfs/swarm.key

networks:
  proxy:
    external: true
  backend:
    internal: true
