notes:
- Processes is the canonical owner of process definitions, orchestration, work briefs,
  baton handoffs, journals, and runtime state.
- CRM-HR owns durable human/AI business identity and reusable role/agent templates.
- Workspace owns provider/model profile truth.
- Projects owns project scope and context; Processes links to it through typed references
  rather than copying hierarchy.
- Live canvas supervision is a projection over canonical definition + runtime evidence,
  not mutable source of truth.
- Future AgentFramework integration remains a later adapter seam using process-bound
  correlation and policy mapping.
